<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio · Ham</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root {
            --bg:      #0d1117;
            --surface: #161b22;
            --border:  #30363d;
            --text:    #c9d1d9;
            --dim:     #8b949e;
            --green:   #3fb950;
            --red:     #f85149;
            --blue:    #58a6ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; font-size: 13px;
        }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .logo { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--dim); }
        .status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
        .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
        .dot.loading { background: #e3b341; animation: blink .9s infinite; }
        .dot.offline { background: var(--red); }
        @keyframes blink { 50% { opacity: .2; } }
        .btn {
            background: none; border: 1px solid var(--border);
            color: var(--dim); font-size: 10px; padding: 2px 8px;
            border-radius: 4px; cursor: pointer; font-family: inherit;
        }
        .btn:hover { border-color: var(--dim); color: var(--text); }

        .metrics { display: grid; grid-template-columns: repeat(3,1fr); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .metric { padding: 14px 20px; border-right: 1px solid var(--border); }
        .metric:last-child { border-right: none; }
        .metric-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
        .metric-value { font-size: 22px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

        .body { display: flex; flex: 1; min-height: 0; }
        .chart-side { flex: 1; padding: 14px 12px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .chart-wrap { flex: 1.3; position: relative; min-height: 0; }

        /* ── Performance comparison section ── */
        .perf-section { flex: 1; display: flex; flex-direction: column; border-top: 1px solid var(--border); padding-top: 10px; min-height: 0; }
        .perf-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .perf-title { font-size: 10px; font-weight: 600; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
        .perf-period { font-size: 9px; color: var(--dim); }
        .perf-badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
        .perf-badge { padding: 6px 8px; background: var(--surface); border-radius: 4px; border: 1px solid var(--border); }
        .perf-badge .plabel { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 4px; }
        .perf-badge .pdot { width: 8px; height: 2px; display: inline-block; }
        .perf-badge .pvalue { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
        .perf-chart-wrap { flex: 1; position: relative; min-height: 80px; }
        .perf-disclaim { font-size: 9px; color: var(--dim); margin-top: 6px; font-style: italic; line-height: 1.4; }
        .table-side { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .toolbar-label { font-size: 10px; color: var(--dim); font-weight: 600; letter-spacing: .08em; }
        .sort-group { display: flex; gap: 2px; }
        .sb { background: none; border: none; font-size: 10px; font-weight: 600; letter-spacing: .05em; color: var(--dim); padding: 3px 9px; border-radius: 4px; cursor: pointer; font-family: inherit; }
        .sb.on { color: var(--blue); background: rgba(88,166,255,.12); }

        .tscroll { flex: 1; overflow-y: auto; }
        .tscroll::-webkit-scrollbar { width: 3px; }
        .tscroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .tscroll::-webkit-scrollbar-track { background: transparent; }

        table { width: 100%; border-collapse: collapse; }
        thead th { font-size: 10px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; padding: 6px 12px; text-align: left; position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); }
        thead th.ar { text-align: right; }
        tbody td { padding: 5px 12px; border-bottom: 1px solid #1c2128; font-variant-numeric: tabular-nums; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: var(--surface); }
        td.ar { text-align: right; }
        .sym { font-weight: 600; }
        .wt  { font-size: 10px; color: var(--dim); font-weight: 400; margin-left: 4px; }
        .bk  { font-size: 10px; color: var(--dim); }
        .sub { font-size: 10px; color: var(--dim); }
        .g   { color: var(--green); }
        .r   { color: var(--red); }
        .dim { color: var(--dim); }

        .hide-row { padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .hide-btn {
            width: 100%; background: none; border: 1px solid var(--border);
            color: var(--text); font-size: 12px; font-weight: 600; letter-spacing: .12em;
            padding: 9px 16px; border-radius: 6px; cursor: pointer; font-family: inherit;
            text-transform: uppercase;
        }
        .hide-btn:hover { border-color: var(--dim); background: var(--surface); }
        .hide-btn:active { background: var(--border); }

        /* ── Mobile-only details row (hidden by default) ── */
        .row-details { display: none; }

        /* ── Responsive: phone layout (≤768px) ── */
        @media (max-width: 768px) {
            /* Stack chart + table แทนที่จะเรียงซ้าย-ขวา */
            .body { flex-direction: column; }
            .chart-side {
                flex: 0 0 auto;
                min-height: 220px; height: 36vh; max-height: 300px;
                border-right: none; border-bottom: 1px solid var(--border);
                padding: 10px 8px;
            }
            /* ซ่อน Performance vs Market บนมือถือ — ดูได้บนคอม */
            .perf-section { display: none; }
            .table-side { flex: 1 1 auto; min-height: 0; }

            /* ซ่อน column และปุ่มที่ไม่จำเป็นบนมือถือ */
            .col-mobile-hide { display: none !important; }
            .sb-az { display: none; }

            /* Metric ด้านบนกระชับขึ้น */
            .metric { padding: 10px 12px; }
            .metric-value { font-size: 17px; }
            .metric-label { font-size: 9px; }

            /* Touch target ใหญ่ขึ้น */
            tbody td { padding: 9px 10px; }
            .sb { padding: 5px 11px; font-size: 11px; }

            /* ลูกศรชี้ว่าแถวกดได้ */
            tbody tr.row-main { cursor: pointer; }
            tbody tr.row-main .sym::before {
                content: '▸'; color: var(--dim); margin-right: 6px;
                font-size: 10px; display: inline-block;
                transition: transform 0.15s ease;
            }
            tbody tr.row-main.expanded .sym::before { transform: rotate(90deg); }

            /* แถวรายละเอียดที่ขยายออก */
            .row-details.expanded { display: table-row; }
            .row-details td {
                background: var(--surface);
                padding: 12px 14px;
                border-bottom: 1px solid var(--border);
            }
            .details-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px 18px;
            }
            .details-item .label {
                font-size: 9px; color: var(--dim);
                text-transform: uppercase; letter-spacing: .1em;
                margin-bottom: 4px;
            }
            .details-item .val {
                font-size: 13px;
                font-variant-numeric: tabular-nums;
            }
            .details-item .val .sub { font-size: 10px; margin-top: 2px; }
        }
    </style>
</head>

function toFinnhub(yq) {
    if (yq.endsWith('.HK')) return 'HKEX:' + parseInt(yq, 10);
    return yq;
}

const YAHOO_PROXY = 'https://yahoo-proxy.supanut12w.workers.dev/?url=';

async function yahooQuote(yq) {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(yq)}?range=1d&interval=1d`;
    const r = await fetch(YAHOO_PROXY + encodeURIComponent(url));
    const d = await r.json();
    return d?.chart?.result?.[0]?.meta?.regularMarketPrice ?? null;
}

async function yahooHistorical(yq, fromTs, toTs) {
    /* Pad +3 days in case the ref date falls on a market holiday */
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(yq)}?period1=${fromTs}&period2=${toTs + 86400 * 3}&interval=1d`;
    const r = await fetch(YAHOO_PROXY + encodeURIComponent(url));
    const d = await r.json();
    const closes = d?.chart?.result?.[0]?.indicators?.quote?.[0]?.close;
    return closes?.find(c => c != null) ?? null;
}

/* ── Hide toggle ── */
function toggleHide() {
    hidden = !hidden;
    document.getElementById('hideBtn').textContent = hidden ? 'Show Numbers' : 'Hide Numbers';
    render();
}
const M = v => hidden ? '*****' : v;

/* ── Render ── */
function render() {
    const totVal  = PORT.reduce((s,d) => s+d.val,  0);
    const totPL   = PORT.reduce((s,d) => s+d.pl,   0);
    const totCost = PORT.reduce((s,d) => s+d.cost, 0);
    const roi     = (totPL / totCost * 100).toFixed(2);

    document.getElementById('mVal').textContent =
        hidden ? '*****' : '฿' + Math.round(totVal * THB).toLocaleString('th-TH');

    const plEl = document.getElementById('mPL');
    plEl.textContent = hidden ? '*****' : (totPL >= 0 ? '+฿' : '-฿') +
        Math.abs(Math.round(totPL * THB)).toLocaleString('th-TH');
    plEl.className = 'metric-value ' + (hidden ? 'dim' : (totPL >= 0 ? 'g' : 'r'));

    const roiEl = document.getElementById('mROI');
    roiEl.textContent = hidden ? '*****' : (roi >= 0 ? '+' : '') + roi + '%';
    roiEl.className = 'metric-value ' + (hidden ? 'dim' : (roi >= 0 ? 'g' : 'r'));

    document.getElementById('tbody').innerHTML = PORT.map(s => {
        const g   = hidden ? 'dim' : (s.pl >= 0 ? 'g' : 'r');
        const cur = s.cur === 'HKD' ? 'HK$' : '$';
        const avgCost  = (s.shares && s.cur === 'USD') ? s.cost / s.shares : null;
        const avgStr   = avgCost != null
            ? ' <span class="sub">($' + avgCost.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + ')</span>'
            : '';
        const priceStr = hidden ? '*****' : s.price != null
            ? cur + s.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + avgStr
            : '—';
        const valUSD = hidden ? '*****' : '$' + Math.round(s.val).toLocaleString();
        const valTHB = hidden ? '*****' : '฿' + Math.round(s.val*THB).toLocaleString('th-TH');
        const pls    = hidden ? '*****' : (s.pl >= 0 ? '+$' : '-$') + Math.abs(s.pl).toLocaleString(undefined,{maximumFractionDigits:0});
        const plsTHB = hidden ? '*****' : (s.pl >= 0 ? '+฿' : '-฿') + Math.abs(Math.round(s.pl*THB)).toLocaleString('th-TH');
        const ps     = hidden ? '*****' : (s.pct >= 0 ? '+' : '') + s.pct.toFixed(1) + '%';
        const wt     = hidden ? '' : `<span class="wt">${(s.val/totVal*100).toFixed(1)}%</span>`;
        return `<tr class="row-main" data-sym="${s.sym}" onclick="toggleDetails('${s.sym}')">
            <td><div class="sym ${g}">${s.sym}${wt}</div><div class="bk">${s.broker}</div></td>
            <td class="ar ${g} col-mobile-hide">${priceStr}</td>
            <td class="ar ${g}">
                <div>${valUSD}</div>
                <div class="sub">${valTHB}</div>
            </td>
            <td class="ar ${g} col-mobile-hide">
                <div>${pls}</div>
                <div class="sub">${plsTHB}</div>
            </td>
            <td class="ar ${g}"><b>${ps}</b></td>
        </tr>
        <tr class="row-details" data-sym="${s.sym}">
            <td colspan="5">
                <div class="details-grid">
                    <div class="details-item">
                        <div class="label">Price (Cost)</div>
                        <div class="val ${g}">${priceStr}</div>
                    </div>
                    <div class="details-item">
                        <div class="label">P/L</div>
                        <div class="val ${g}">${pls}<div class="sub">${plsTHB}</div></div>
                    </div>
                </div>
            </td>
        </tr>`;
    }).join('');

    if (chartInst) chartInst.destroy();
    const sorted = [...PORT];
    chartInst = new Chart(document.getElementById('chart'), {
        type: 'doughnut',
        data: {
            labels: sorted.map(s => s.sym),
            datasets: [{ data: sorted.map(s => s.val), backgroundColor: sorted.map(s => COLOR_MAP[s.sym]), borderColor:'#0d1117', borderWidth:2, hoverBorderWidth:0 }]
        },
        options: {
            responsive:true, maintainAspectRatio:false, cutout:'55%',
            plugins: {
                legend:{ display: false },
                tooltip:{ callbacks:{ label: ctx => ` $${Math.round(ctx.raw).toLocaleString()}` } },
                datalabels: {
                    display: ctx => {
                        const total = ctx.dataset.data.reduce((a,b) => a+b, 0);
                        return ctx.dataset.data[ctx.dataIndex] / total >= 0.04;
                    },
                    formatter: (_, ctx) => ctx.chart.data.labels[ctx.dataIndex],
                    color: '#ffffff',
                    font: { size: 10, weight: '700' },
                    textShadowBlur: 6,
                    textShadowColor: 'rgba(0,0,0,0.8)',
                }
            }
        }
    });
}

function doSort(key, btn) {
    document.querySelectorAll('.sb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    PORT.sort((a,b) => key === 'sym' ? a.sym.localeCompare(b.sym) : b[key] - a[key]);
    render();
}

/* ── Tap-to-expand row (mobile only) ── */
function toggleDetails(sym) {
    if (window.innerWidth > 768) return;
    document.querySelectorAll(`tr[data-sym="${sym}"]`).forEach(r => r.classList.toggle('expanded'));
}


/* ── Main loader ──────────────────────────────────────────── */
function clearCache() {
    localStorage.removeItem(CACHE_KEY);
    startLoad();
}

async function startLoad() {
    const dot = document.getElementById('dot');
    const ts  = document.getElementById('ts');
    dot.className = 'dot loading';
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    try {
        let shares = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');

        /* ── Pre-populate shares จาก PORT ที่ระบุไว้ตรงๆ (ป้องกันราคา historical ผิด) ── */
        PORT.forEach(s => { if (s.shares != null) shares[s.sym] = s.shares; });

        /* ── Step 1: คำนวณ shares จากราคา 27 เม.ย. 2026 (เฉพาะครั้งแรก แล้ว cache) ── */
        const missing = PORT.filter(s => shares[s.sym] == null);
        for (let i = 0; i < missing.length; i++) {
            const s = missing[i];
            ts.textContent = `คำนวณ shares… ${i+1}/${missing.length}`;
            try {
                let refPrice = null;
                if (s.yq.endsWith('.HK')) {
                    refPrice = await yahooHistorical(s.yq, REF_TS, REF_TS + 86400);
                } else {
                    const fhSym = toFinnhub(s.yq);
                    const r = await fetch(
                        `https://finnhub.io/api/v1/stock/candle?symbol=${encodeURIComponent(fhSym)}` +
                        `&resolution=D&from=${REF_TS}&to=${REF_TS + 86400}&token=${FINN_KEY}`
                    );
                    const d = await r.json();
                    if (d.s !== 'no_data' && d.c && d.c.length > 0) refPrice = d.c[0];
                }
                if (refPrice) {
                    shares[s.sym] = (s.cur === 'HKD' ? s.val * 7.8 : s.val) / refPrice;
                }
            } catch(e) { console.warn('refPrice error:', s.sym, e); }
            if (i < missing.length - 1) await sleep(300);
        }
        if (missing.length) localStorage.setItem(CACHE_KEY, JSON.stringify(shares));

        /* ── Step 2: อัตราแลกเปลี่ยน HKD/USD ── */
        let hkdPerUsd = 7.8;
        try {
            const r = await fetch(`https://finnhub.io/api/v1/forex/rates?base=USD&token=${FINN_KEY}`);
            const d = await r.json();
            if (d.quote && d.quote.HKD) hkdPerUsd = d.quote.HKD;
        } catch(e) {}

        /* ── Step 3: ราคาปัจจุบันทีละตัว — HK ใช้ Yahoo, US ใช้ Finnhub ── */
        ts.textContent = 'โหลดราคาล่าสุด...';
        let done = 0;
        for (let i = 0; i < PORT.length; i++) {
            const s = PORT[i];
            try {
                let p = null;
                if (s.yq.endsWith('.HK')) {
                    p = await yahooQuote(s.yq);
                } else {
                    const fhSym = toFinnhub(s.yq);
                    const r = await fetch(
                        `https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(fhSym)}&token=${FINN_KEY}`
                    );
                    const d = await r.json();
                    p = d.c;
                }
                if (!p) continue;
                s.price = p;
                done++;
                const n = shares[s.sym];
                if (n == null) {
                    shares[s.sym] = (s.cur === 'HKD' ? s.val * hkdPerUsd : s.val) / p;
                } else {
                    s.val = s.cur === 'HKD' ? (n * p) / hkdPerUsd : n * p;
                    s.pl  = s.val - s.cost;
                    s.pct = (s.pl / s.cost) * 100;
                }
                ts.textContent = `อัปเดต ${done}/${PORT.length}…`;
            } catch(e) { console.warn('quote error:', s.sym, e); }
            if (i < PORT.length - 1) await sleep(200);
        }

        localStorage.setItem(CACHE_KEY, JSON.stringify(shares));

        const now = new Date();
        ts.textContent = 'LIVE · ' + now.toLocaleString('th-TH', {
            day:'2-digit', month:'short', year:'numeric',
            hour:'2-digit', minute:'2-digit'
        });
        dot.className = done > 0 ? 'dot' : 'dot offline';
        if (!done) ts.textContent = 'ราคา ณ 9 พ.ค. 2569 (ออฟไลน์)';

    } catch(e) {
        console.error(e);
        document.getElementById('ts').textContent = 'ราคา ณ 9 พ.ค. 2569 (ออฟไลน์)';
        document.getElementById('dot').className = 'dot offline';
    }

    render();
}

/* ── Performance vs Market (Since 18 Sep 2025) ──────────────── */
const PERF_BASELINE_TS = Math.floor(new Date('2025-09-18T00:00:00Z').getTime() / 1000);
const PERF_CACHE_KEY   = 'perf_v2';
const PERF_CACHE_TTL   = 3600 * 1000;   // 1 hour
let perfChartInst = null;

async function fetchYahooCandle(yqSym, fromTs, toTs) {
    /* Yahoo accepts US tickers (NVDA) and HK (9988.HK) directly */
    const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(yqSym)}?period1=${fromTs}&period2=${toTs}&interval=1d`;
    try {
        const r = await fetch(YAHOO_PROXY + encodeURIComponent(yahooUrl));
        const d = await r.json();
        const result = d?.chart?.result?.[0];
        if (!result?.timestamp || !result?.indicators?.quote?.[0]?.close) return null;
        const times = result.timestamp;
        const closes = result.indicators.quote[0].close;
        /* Filter out null closes (Yahoo sometimes returns nulls for half days) */
        const cleaned = times.map((t, i) => [t, closes[i]]).filter(([, c]) => c != null);
        if (cleaned.length === 0) return null;
        return {
            times:  cleaned.map(([t]) => t),
            prices: cleaned.map(([, c]) => c),
        };
    } catch (e) {
        console.warn('Yahoo candle error:', yqSym, e.message);
        return null;
    }
}

async function loadPerformance() {
    /* Try cache first */
    const cached = JSON.parse(localStorage.getItem(PERF_CACHE_KEY) || 'null');
    if (cached && Date.now() - cached.fetchedAt < PERF_CACHE_TTL) {
        renderPerformance(cached.data);
        return;
    }

    const today = Math.floor(Date.now() / 1000);
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    /* Fetch candles for all PORT stocks + benchmarks */
    const targets = [
        ...PORT.map(s => ({ sym: s.sym, yq: s.yq })),
        { sym: 'VOO', yq: 'VOO' },
        { sym: 'QQQ', yq: 'QQQ' },
    ];
    const candles = {};
    for (let i = 0; i < targets.length; i++) {
        candles[targets[i].sym] = await fetchYahooCandle(targets[i].yq, PERF_BASELINE_TS, today);
        if (i < targets.length - 1) await sleep(150);
    }

    if (!candles['VOO'] || !candles['QQQ']) {
        document.getElementById('perfDisclaim').textContent =
            '⚠️ โหลดข้อมูล benchmark ไม่สำเร็จ — กรุณารีเฟรชใหม่';
        return;
    }

    /* Per-symbol price maps */
    const priceMaps = {};
    for (const sym in candles) {
        if (!candles[sym]) continue;
        priceMaps[sym] = {};
        candles[sym].times.forEach((t, i) => { priceMaps[sym][t] = candles[sym].prices[i]; });
    }

    const vooMap = priceMaps['VOO'];
    const qqqMap = priceMaps['QQQ'];

    /* Compute shares for each PORT stock if not hardcoded.
       For US: shares = val / price_at_baseline (using current val as proxy is wrong → use cost basis)
       For HK: shares = (val_HKD) / price_HKD_at_baseline
       The cleanest approach: if shares missing, derive from val_today_in_HKD/USD ÷ first available price. */
    const hkdPerUsd = 7.8;
    const sharesMap = {};
    for (const s of PORT) {
        if (s.shares != null) {
            sharesMap[s.sym] = s.shares;
            continue;
        }
        /* Derive HK shares: use val (which is HKD) ÷ price ที่วันใกล้สุดที่มี */
        const candle = candles[s.sym];
        if (candle && candle.prices.length > 0) {
            /* Use last available price as approximation (so shares × last_price ≈ s.val) */
            const lastPrice = candle.prices[candle.prices.length - 1];
            sharesMap[s.sym] = s.val / lastPrice;  // HKD / HKD = shares
        }
    }

    /* Build portfolio time-series using VOO trading days as backbone */
    const benchTimes = candles['VOO'].times.slice().sort((a,b) => a-b);
    const validTimes = [];
    const portValues = [];
    const vooValues  = [];
    const qqqValues  = [];
    const skippedSyms = new Set();

    for (const t of benchTimes) {
        let pv = 0;
        let allOk = true;
        for (const s of PORT) {
            const shr = sharesMap[s.sym];
            if (shr == null) { skippedSyms.add(s.sym); continue; }
            const p = priceMaps[s.sym]?.[t];
            if (p == null) {
                /* Find nearest preceding day for this symbol (HK off-day fallback) */
                const candle = candles[s.sym];
                if (!candle) { skippedSyms.add(s.sym); continue; }
                let prevPrice = null;
                for (let i = candle.times.length - 1; i >= 0; i--) {
                    if (candle.times[i] <= t) { prevPrice = candle.prices[i]; break; }
                }
                if (prevPrice == null) { allOk = false; break; }
                pv += s.cur === 'HKD' ? (shr * prevPrice) / hkdPerUsd : shr * prevPrice;
                continue;
            }
            pv += s.cur === 'HKD' ? (shr * p) / hkdPerUsd : shr * p;
        }
        if (allOk && pv > 0 && vooMap[t] != null && qqqMap[t] != null) {
            validTimes.push(t);
            portValues.push(pv);
            vooValues.push(vooMap[t]);
            qqqValues.push(qqqMap[t]);
        }
    }

    if (validTimes.length === 0) {
        document.getElementById('perfDisclaim').textContent =
            '⚠️ ไม่สามารถคำนวณ portfolio time-series ได้ (data ไม่ครบ)';
        return;
    }

    const portBase = portValues[0];
    const vooBase  = vooValues[0];
    const qqqBase  = qqqValues[0];

    const data = {
        times:     validTimes,
        portfolio: portValues.map(v => (v / portBase - 1) * 100),
        voo:       vooValues.map(v => (v / vooBase - 1) * 100),
        qqq:       qqqValues.map(v => (v / qqqBase - 1) * 100),
        skipped:   [...skippedSyms],
    };

    localStorage.setItem(PERF_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), data }));
    renderPerformance(data);
}

function renderPerformance(data) {
    if (!data || !data.times || data.times.length === 0) return;

    const last = arr => arr[arr.length - 1];
    const lp = last(data.portfolio), lv = last(data.voo), lq = last(data.qqq);
    const fmt = v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
    const cls = v => v >= 0 ? 'g' : 'r';

    const setBadge = (id, v) => {
        const el = document.getElementById(id);
        el.textContent = fmt(v);
        el.className = 'pvalue ' + cls(v);
    };
    setBadge('perfPort', lp);
    setBadge('perfVOO',  lv);
    setBadge('perfQQQ',  lq);

    /* Disclaim */
    const skipped = data.skipped || [];
    const skipNote = skipped.length > 0 ? ' · ไม่รวม: ' + skipped.join(', ') : '';
    document.getElementById('perfDisclaim').innerHTML =
        '* ดูคร่าวๆ เทียบ benchmark ตั้งแต่ 18 ก.ย. 2568 · สมมติถือ shares ปัจจุบันตลอด period (ตัวเลขจะเพี้ยนเมื่อซื้อ/ขายหุ้นเพิ่ม)' + skipNote;

    const labels = data.times.map(t => {
        const d = new Date(t * 1000);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    });

    if (perfChartInst) perfChartInst.destroy();
    perfChartInst = new Chart(document.getElementById('perfChart'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'Portfolio', data: data.portfolio, borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.08)', borderWidth: 2.2, pointRadius: 0, pointHoverRadius: 4, tension: 0.25, fill: true, order: 1 },
                { label: 'VOO',       data: data.voo,       borderColor: '#8b949e', backgroundColor: 'transparent',           borderWidth: 1.4, pointRadius: 0, pointHoverRadius: 3, tension: 0.25, borderDash: [5,3], order: 2 },
                { label: 'QQQ',       data: data.qqq,       borderColor: '#e3b341', backgroundColor: 'transparent',           borderWidth: 1.4, pointRadius: 0, pointHoverRadius: 3, tension: 0.25, borderDash: [5,3], order: 3 },
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                datalabels: { display: false },
                tooltip: {
                    backgroundColor: '#161b22',
                    borderColor: '#30363d',
                    borderWidth: 1,
                    titleColor: '#c9d1d9',
                    bodyColor: '#c9d1d9',
                    callbacks: {
                        label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y >= 0 ? '+' : ''}${ctx.parsed.y.toFixed(2)}%`,
                    },
                },
            },
            scales: {
                x: { ticks: { color: '#8b949e', font: { size: 9 }, maxTicksLimit: 6, maxRotation: 0, autoSkip: true }, grid: { color: '#1c2128', drawTicks: false } },
                y: { ticks: { color: '#8b949e', font: { size: 9 }, callback: v => (v >= 0 ? '+' : '') + v + '%' }, grid: { color: '#1c2128', drawTicks: false } },
            },
        },
    });
}

/* ── Boot ── */
PORT.sort((a,b) => b.val - a.val);   // เรียงตาม SIZE เป็นค่าเริ่มต้น
render();
startLoad().then(() => {
    /* Skip Performance chart on mobile (hidden by CSS, no need to fetch ~20 candles) */
    if (window.innerWidth > 768) loadPerformance();
});
