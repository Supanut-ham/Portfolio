<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio · Ham</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root {
            --bg:      #0d1117;
            --surface: #161b22;
            --border:  #30363d;
            --text:    #c9d1d9;
            --dim:     #8b949e;
            --green:   #3fb950;
            --red:     #f85149;
            --blue:    #58a6ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; font-size: 13px;
        }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .logo { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--dim); }
        .status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
        .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
        .dot.loading { background: #e3b341; animation: blink .9s infinite; }
        .dot.offline { background: var(--red); }
        @keyframes blink { 50% { opacity: .2; } }
        .btn {
            background: none; border: 1px solid var(--border);
            color: var(--dim); font-size: 10px; padding: 2px 8px;
            border-radius: 4px; cursor: pointer; font-family: inherit;
        }
        .btn:hover { border-color: var(--dim); color: var(--text); }

        .metrics { display: grid; grid-template-columns: repeat(3,1fr); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .metric { padding: 14px 20px; border-right: 1px solid var(--border); }
        .metric:last-child { border-right: none; }
        .metric-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
        .metric-value { font-size: 22px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

        .body { display: flex; flex: 1; min-height: 0; }
        .chart-side { flex: 1; padding: 14px 12px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .chart-wrap { flex: 1; position: relative; min-height: 0; }
        .table-side { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .toolbar-label { font-size: 10px; color: var(--dim); font-weight: 600; letter-spacing: .08em; }
        .sort-group { display: flex; gap: 2px; }
        .sb { background: none; border: none; font-size: 10px; font-weight: 600; letter-spacing: .05em; color: var(--dim); padding: 3px 9px; border-radius: 4px; cursor: pointer; font-family: inherit; }
        .sb.on { color: var(--blue); background: rgba(88,166,255,.12); }

        .tscroll { flex: 1; overflow-y: auto; }
        .tscroll::-webkit-scrollbar { width: 3px; }
        .tscroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .tscroll::-webkit-scrollbar-track { background: transparent; }

        table { width: 100%; border-collapse: collapse; }
        thead th { font-size: 10px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; padding: 6px 12px; text-align: left; position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); }
        thead th.ar { text-align: right; }
        tbody td { padding: 5px 12px; border-bottom: 1px solid #1c2128; font-variant-numeric: tabular-nums; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: var(--surface); }
        td.ar { text-align: right; }
        .sym { font-weight: 600; }
        .wt  { font-size: 10px; color: var(--dim); font-weight: 400; margin-left: 4px; }
        .bk  { font-size: 10px; color: var(--dim); }
        .sub { font-size: 10px; color: var(--dim); }
        .g   { color: var(--green); }
        .r   { color: var(--red); }
    </style>
</head>
<body>

<header>
    <span class="logo">PORTFOLIO · HAM</span>
    <div class="status">
        <div class="dot loading" id="dot"></div>
        <span id="ts">กำลังโหลด...</span>
        <button class="btn" onclick="startLoad()">↻</button>
        <button class="btn" onclick="clearCache()" title="รีเซ็ต cache หุ้น">✕ cache</button>
        <button class="btn" id="hideBtn" onclick="toggleHide()">hide</button>
    </div>
</header>

<div class="metrics">
    <div class="metric"><div class="metric-label">Total Value</div><div class="metric-value" id="mVal">—</div></div>
    <div class="metric"><div class="metric-label">Unrealized P/L</div><div class="metric-value" id="mPL">—</div></div>
    <div class="metric"><div class="metric-label">ROI</div><div class="metric-value" id="mROI">—</div></div>
</div>

<div class="body">
    <div class="chart-side">
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </div>
    <div class="table-side">
        <div class="toolbar">
            <span class="toolbar-label">HOLDINGS</span>
            <div class="sort-group">
                <button class="sb on" onclick="doSort('val',this)">SIZE</button>
                <button class="sb"    onclick="doSort('pct',this)">GAIN%</button>
                <button class="sb"    onclick="doSort('sym',this)">A–Z</button>
            </div>
        </div>
        <div class="tscroll">
            <table>
                <thead><tr>
                    <th>SYMBOL</th>
                    <th class="ar">PRICE <span class="sub">(COST)</span></th>
                    <th class="ar">VALUE</th>
                    <th class="ar">P/L</th>
                    <th class="ar">%</th>
                </tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
/* ── Portfolio snapshot: 9 May 2026 ───────────────────────────
   cost = val − pl  (ทุน คงที่ไม่เปลี่ยน)
   cur  = สกุลเงิน (USD หรือ HKD)
   yq   = Yahoo symbol (ใช้แปลงเป็น Finnhub)
   shares = จำนวนหุ้นจริง (จากรูปโบรกเกอร์ใน /พอท)
─────────────────────────────────────────────────────────────── */
const THB       = 32.11;
const CACHE_KEY = 'port_v7';
let   hidden    = false;
const REF_TS    = 1777248000;   // 2026-04-27 00:00 UTC
const FINN_KEY  = 'd7u22f1r01qvtsq070dgd7u22f1r01qvtsq070e0';

function toFinnhub(yq) {
    if (yq.endsWith('.HK')) return 'HKEX:' + parseInt(yq, 10);
    return yq;
}

let PORT = [
    { broker:'Dime',      sym:'ARM',       yq:'ARM',     cur:'USD', cost:3990.77,  val:5529.29,  pl:1538.52,   pct:38.55,  shares:25.9262,  price:213.27 },
    { broker:'Dime',      sym:'CRWD',      yq:'CRWD',    cur:'USD', cost:4687.22,  val:5195.51,  pl:508.29,    pct:10.84,  shares:9.8443,   price:527.77 },
    { broker:'Dime',      sym:'RBRK',      yq:'RBRK',    cur:'USD', cost:1564.88,  val:1284.36,  pl:-280.52,   pct:-17.93, shares:20.6025,  price:62.34  },
    { broker:'Dime',      sym:'GRAB',      yq:'GRAB',    cur:'USD', cost:1558.46,  val:960.04,   pl:-598.42,   pct:-38.40, shares:258.0753, price:3.72   },
    { broker:'Dime',      sym:'ZS',        yq:'ZS',      cur:'USD', cost:1387.87,  val:863.84,   pl:-524.03,   pct:-37.76, shares:5.6783,   price:152.13 },
    { broker:'Webull',    sym:'NVDA',      yq:'NVDA',    cur:'USD', cost:1544.65,  val:1812.26,  pl:267.61,    pct:17.33,  shares:8.42717,  price:215.05 },
    { broker:'Webull',    sym:'DDOG',      yq:'DDOG',    cur:'USD', cost:1571.68,  val:2454.83,  pl:883.15,    pct:56.19,  shares:12.27414, price:200.00 },
    { broker:'Webull',    sym:'AMZN',      yq:'AMZN',    cur:'USD', cost:2222.38,  val:2577.35,  pl:354.97,    pct:15.97,  shares:9.45123,  price:272.70 },
    { broker:'Webull',    sym:'SE',        yq:'SE',      cur:'USD', cost:1569.97,  val:869.90,   pl:-700.07,   pct:-44.59, shares:10,       price:86.99  },
    { broker:'Webull',    sym:'CRWV',      yq:'CRWV',    cur:'USD', cost:1601.71,  val:1939.13,  pl:337.42,    pct:21.07,  shares:17.0308,  price:113.86 },
    { broker:'Webull',    sym:'MSFT',      yq:'MSFT',    cur:'USD', cost:2238.44,  val:1927.82,  pl:-310.62,   pct:-13.88, shares:4.64423,  price:415.10 },
    { broker:'Webull',    sym:'NBIS',      yq:'NBIS',    cur:'USD', cost:1601.71,  val:2792.94,  pl:1191.23,   pct:74.37,  shares:15.64848, price:178.48 },
    { broker:'Webull',    sym:'PANW',      yq:'PANW',    cur:'USD', cost:1527.64,  val:1876.98,  pl:349.34,    pct:22.87,  shares:9.0636,   price:207.09 },
    { broker:'Webull',    sym:'AXON',      yq:'AXON',    cur:'USD', cost:3754.00,  val:2654.16,  pl:-1099.84,  pct:-29.30, shares:6.58519,  price:403.05 },
    { broker:'Streaming', sym:'BABA80',    yq:'9988.HK', cur:'HKD', cost:153.69,   val:229.28,   pl:75.59,     pct:49.19  },
    { broker:'Streaming', sym:'CATL01',    yq:'3750.HK', cur:'HKD', cost:1460.74,  val:2027.14,  pl:566.40,    pct:38.78  },
    { broker:'Streaming', sym:'TENCENT80', yq:'0700.HK', cur:'HKD', cost:1164.81,  val:1263.42,  pl:98.61,     pct:8.47   },
    { broker:'Streaming', sym:'XIAOMI80',  yq:'1810.HK', cur:'HKD', cost:813.27,   val:1334.22,  pl:520.95,    pct:64.06  },
];

/* ── Chart ── */
Chart.register(ChartDataLabels);
let chartInst = null;
/* สีแบรนด์/โลโก้จริงของแต่ละหุ้น — สีคงที่ไม่เปลี่ยนตามการ sort */
const COLOR_MAP = {
    // Dime
    'ARM':       '#0091BD',  // ARM teal-blue
    'CRWD':      '#FA1F1F',  // CrowdStrike red
    'RBRK':      '#00B7AF',  // Rubrik teal
    'GRAB':      '#00B14F',  // Grab green
    'ZS':        '#0033A0',  // Zscaler navy
    // Webull
    'NVDA':      '#76B900',  // NVIDIA green (iconic)
    'DDOG':      '#632CA6',  // Datadog purple
    'AMZN':      '#FF9900',  // Amazon orange
    'SE':        '#EE4D2D',  // Sea/Shopee red-orange
    'CRWV':      '#6366F1',  // CoreWeave indigo
    'MSFT':      '#00A4EF',  // Microsoft blue
    'NBIS':      '#FFE800',  // Nebius bright yellow
    'PANW':      '#FA582D',  // Palo Alto orange
    'AXON':      '#DAA520',  // Axon goldenrod
    // Streaming (HK)
    'BABA80':    '#FF6A00',  // Alibaba orange
    'CATL01':    '#00529A',  // CATL blue
    'TENCENT80': '#1976D2',  // Tencent blue
    'XIAOMI80':  '#FF6900',  // Xiaomi orange
};

/* ── Hide toggle ── */
function toggleHide() {
    hidden = !hidden;
    document.getElementById('hideBtn').textContent = hidden ? 'show' : 'hide';
    render();
}
const M = v => hidden ? '*****' : v;

/* ── Render ── */
function render() {
    const totVal  = PORT.reduce((s,d) => s+d.val,  0);
    const totPL   = PORT.reduce((s,d) => s+d.pl,   0);
    const totCost = PORT.reduce((s,d) => s+d.cost, 0);
    const roi     = (totPL / totCost * 100).toFixed(2);

    document.getElementById('mVal').textContent =
        hidden ? '*****' : '฿' + Math.round(totVal * THB).toLocaleString('th-TH');

    const plEl = document.getElementById('mPL');
    plEl.textContent = hidden ? '*****' : (totPL >= 0 ? '+฿' : '-฿') +
        Math.abs(Math.round(totPL * THB)).toLocaleString('th-TH');
    plEl.className = 'metric-value ' + (totPL >= 0 ? 'g' : 'r');

    const roiEl = document.getElementById('mROI');
    roiEl.textContent = hidden ? '*****' : (roi >= 0 ? '+' : '') + roi + '%';
    roiEl.className = 'metric-value ' + (roi >= 0 ? 'g' : 'r');

    document.getElementById('tbody').innerHTML = PORT.map(s => {
        const g   = s.pl >= 0 ? 'g' : 'r';
        const cur = s.cur === 'HKD' ? 'HK$' : '$';
        const avgCost  = (s.shares && s.cur === 'USD') ? s.cost / s.shares : null;
        const avgStr   = avgCost != null
            ? ' <span class="sub">($' + avgCost.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + ')</span>'
            : '';
        const priceStr = hidden ? '*****' : s.price != null
            ? cur + s.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + avgStr
            : '—';
        const valUSD = hidden ? '*****' : '$' + Math.round(s.val).toLocaleString();
        const valTHB = hidden ? '*****' : '฿' + Math.round(s.val*THB).toLocaleString('th-TH');
        const pls    = hidden ? '*****' : (s.pl >= 0 ? '+$' : '-$') + Math.abs(s.pl).toLocaleString(undefined,{maximumFractionDigits:0});
        const plsTHB = hidden ? '*****' : (s.pl >= 0 ? '+฿' : '-฿') + Math.abs(Math.round(s.pl*THB)).toLocaleString('th-TH');
        const ps     = hidden ? '*****' : (s.pct >= 0 ? '+' : '') + s.pct.toFixed(1) + '%';
        const wt     = hidden ? '' : `<span class="wt">${(s.val/totVal*100).toFixed(1)}%</span>`;
        return `<tr>
            <td><div class="sym ${g}">${s.sym}${wt}</div><div class="bk">${s.broker}</div></td>
            <td class="ar ${g}">${priceStr}</td>
            <td class="ar ${g}">
                <div>${valUSD}</div>
                <div class="sub">${valTHB}</div>
            </td>
            <td class="ar ${g}">
                <div>${pls}</div>
                <div class="sub">${plsTHB}</div>
            </td>
            <td class="ar ${g}"><b>${ps}</b></td>
        </tr>`;
    }).join('');

    if (chartInst) chartInst.destroy();
    const sorted = [...PORT];
    chartInst = new Chart(document.getElementById('chart'), {
        type: 'doughnut',
        data: {
            labels: sorted.map(s => s.sym),
            datasets: [{ data: sorted.map(s => s.val), backgroundColor: sorted.map(s => COLOR_MAP[s.sym]), borderColor:'#0d1117', borderWidth:2, hoverBorderWidth:0 }]
        },
        options: {
            responsive:true, maintainAspectRatio:false, cutout:'55%',
            plugins: {
                legend:{ display: false },
                tooltip:{ callbacks:{ label: ctx => ` $${Math.round(ctx.raw).toLocaleString()}` } },
                datalabels: {
                    display: ctx => {
                        const total = ctx.dataset.data.reduce((a,b) => a+b, 0);
                        return ctx.dataset.data[ctx.dataIndex] / total >= 0.04;
                    },
                    formatter: (_, ctx) => ctx.chart.data.labels[ctx.dataIndex],
                    color: '#ffffff',
                    font: { size: 10, weight: '700' },
                    textShadowBlur: 6,
                    textShadowColor: 'rgba(0,0,0,0.8)',
                }
            }
        }
    });
}

function doSort(key, btn) {
    document.querySelectorAll('.sb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    PORT.sort((a,b) => key === 'sym' ? a.sym.localeCompare(b.sym) : b[key] - a[key]);
    render();
}


/* ── Main loader ──────────────────────────────────────────── */
function clearCache() {
    localStorage.removeItem(CACHE_KEY);
    startLoad();
}

async function startLoad() {
    const dot = document.getElementById('dot');
    const ts  = document.getElementById('ts');
    dot.className = 'dot loading';
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    try {
        let shares = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');

        /* ── Pre-populate shares จาก PORT ที่ระบุไว้ตรงๆ (ป้องกันราคา historical ผิด) ── */
        PORT.forEach(s => { if (s.shares != null) shares[s.sym] = s.shares; });

        /* ── Step 1: คำนวณ shares จากราคา 27 เม.ย. 2026 (เฉพาะครั้งแรก แล้ว cache) ── */
        const missing = PORT.filter(s => shares[s.sym] == null);
        for (let i = 0; i < missing.length; i++) {
            const s = missing[i];
            ts.textContent = `คำนวณ shares… ${i+1}/${missing.length}`;
            try {
                const fhSym = toFinnhub(s.yq);
                const r = await fetch(
                    `https://finnhub.io/api/v1/stock/candle?symbol=${encodeURIComponent(fhSym)}` +
                    `&resolution=D&from=${REF_TS}&to=${REF_TS + 86400}&token=${FINN_KEY}`
                );
                const d = await r.json();
                if (d.s !== 'no_data' && d.c && d.c.length > 0) {
                    shares[s.sym] = (s.cur === 'HKD' ? s.val * 7.8 : s.val) / d.c[0];
                }
            } catch(e) { console.warn('refPrice error:', s.sym, e); }
            if (i < missing.length - 1) await sleep(300);
        }
        if (missing.length) localStorage.setItem(CACHE_KEY, JSON.stringify(shares));

        /* ── Step 2: อัตราแลกเปลี่ยน HKD/USD ── */
        let hkdPerUsd = 7.8;
        try {
            const r = await fetch(`https://finnhub.io/api/v1/forex/rates?base=USD&token=${FINN_KEY}`);
            const d = await r.json();
            if (d.quote && d.quote.HKD) hkdPerUsd = d.quote.HKD;
        } catch(e) {}

        /* ── Step 3: ราคาปัจจุบันทีละตัว ── */
        ts.textContent = 'โหลดราคาล่าสุด...';
        let done = 0;
        for (let i = 0; i < PORT.length; i++) {
            const s = PORT[i];
            try {
                const fhSym = toFinnhub(s.yq);
                const r = await fetch(
                    `https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(fhSym)}&token=${FINN_KEY}`
                );
                const d = await r.json();
                const p = d.c;
                if (!p) continue;
                s.price = p;
                done++;
                const n = shares[s.sym];
                if (n == null) {
                    shares[s.sym] = (s.cur === 'HKD' ? s.val * hkdPerUsd : s.val) / p;
                } else {
                    s.val = s.cur === 'HKD' ? (n * p) / hkdPerUsd : n * p;
                    s.pl  = s.val - s.cost;
                    s.pct = (s.pl / s.cost) * 100;
                }
                ts.textContent = `อัปเดต ${done}/${PORT.length}…`;
            } catch(e) { console.warn('quote error:', s.sym, e); }
            if (i < PORT.length - 1) await sleep(200);
        }

        localStorage.setItem(CACHE_KEY, JSON.stringify(shares));

        const now = new Date();
        ts.textContent = 'LIVE · ' + now.toLocaleString('th-TH', {
            day:'2-digit', month:'short', year:'numeric',
            hour:'2-digit', minute:'2-digit'
        });
        dot.className = done > 0 ? 'dot' : 'dot offline';
        if (!done) ts.textContent = 'ราคา ณ 9 พ.ค. 2569 (ออฟไลน์)';

    } catch(e) {
        console.error(e);
        document.getElementById('ts').textContent = 'ราคา ณ 9 พ.ค. 2569 (ออฟไลน์)';
        document.getElementById('dot').className = 'dot offline';
    }

    render();
}

/* ── Boot ── */
render();
startLoad();
</script>
</body>
</html>
